[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation-automation"
version = "0.1.0"
description = "A Python package for evaluating Large Language Models with various metrics and benchmarks"
readme = "README.md"
authors = [
    {name = "Evaluation Automation Team"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/panatchakorn/evaluation-automation"
Repository = "https://github.com/panatchakorn/evaluation-automation"
Issues = "https://github.com/panatchakorn/evaluation-automation/issues"

[tool.hatchling.build.targets.wheel]
packages = ["src/evaluation_automation"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/evaluation_automation --cov-report=html --cov-report=term-missing"